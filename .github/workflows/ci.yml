name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release, warnings denied in-crate)
        # src has `#![deny(warnings)]` on the lib + both bins, so the
        # compiler treats any warning in OUR code as an error — no fragile
        # log-scan, and dependency warnings never fail the build.
        run: cargo build --release
      - name: Test
        run: cargo test --release

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        run: cd sdk && npm install
      - name: Typecheck + build
        run: cd sdk && npx tsc -p tsconfig.json
      - name: Runtime compat check (pure-JS fallbacks, no Node globals)
        run: cd sdk && node scripts/rn-compat-check.mjs

  integration:
    runs-on: ubuntu-latest
    needs: [test, sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build daemon
        run: cargo build --release
      - name: Build SDK
        run: cd sdk && npm install && npx tsc -p tsconfig.json
      - name: Boot daemon + run integration test
        run: node tests/integration.mjs
      - name: Two-node mesh convergence
        run: node tests/mesh.mjs
      - name: Perf regression smoke
        run: node tests/perf.mjs