name: release

# Builds static-musl release binaries for x86_64 and aarch64 and attaches them
# to the tag that triggered it (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
#
# Uses `cross` (cross-rs) so both arches build with their native musl libc —
# no glibc dependency, matching the Alpine runtime image. mimalloc is enabled
# for musl (the Dockerfile rationale: musl's malloc collapses under worker
# contention; mimalloc restores glibc parity).

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - name: SDK typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cd sdk && npm install && npx tsc -p tsconfig.json

  build:
    needs: test
    # softprops/action-gh-release creates the GitHub release for the tag; the
    # default GITHUB_TOKEN is read-only, which 403s ("Resource not accessible
    # by integration") without an explicit write grant here.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - name: Build static-musl (mimalloc)
        run: cross build --release --features mimalloc --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf bunnymeshdb-${{ matrix.target }}.tgz bunnymeshdb bunnymeshdbd
      - name: Attach to tag
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/bunnymeshdb-${{ matrix.target }}.tgz

  # Publishes the ~15 MB Alpine/musl image (bunnymeshdb + bunnymeshdbd + fuse3)
  # to GHCR for the tag: ghcr.io/artemis-bunbun/bunnymeshdb:<tag> + :latest.
  # GITHUB_TOKEN can push packages with an explicit `packages: write` grant.
  docker:
    needs: [test, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/artemis-bunbun/bunnymeshdb:${{ github.ref_name }}
            ghcr.io/artemis-bunbun/bunnymeshdb:latest