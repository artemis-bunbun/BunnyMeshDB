[package]
name = "bunnymeshdb"
version = "0.4.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
mimalloc = { version = "0.1.52", optional = true }
axum = { version = "0.8.9", features = ["macros", "http2"] }
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
fuser = "0.18.0"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.189"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "request-response", "json", "ed25519", "identify"] }
parking_lot = "0.12.5"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-rustls = "0.26.5"
rustls-pemfile = "1.0.1"

[features]
mimalloc = ["dep:mimalloc"]

# For profiling: release-grade but with debug symbols (strip off), so perf can
# resolve hot functions. Used only for measurement; not for shipping.
[profile.perf]
inherits = "release"
strip = false
